<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ballShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Outer Shadow -->
  <circle cx="256" cy="256" r="240" fill="#0b0f19"/>

  <!-- Top Red Half -->
  <path d="M 256,24 A 232,232 0 0,1 488,256 L 24,256 A 232,232 0 0,1 256,24 Z" fill="url(#redGrad)"/>

  <!-- Bottom White Half -->
  <path d="M 24,256 A 232,232 0 0,0 488,256 L 24,256 Z" fill="url(#whiteGrad)"/>

  <!-- Center Black Band -->
  <rect x="24" y="240" width="464" height="32" fill="#1e293b"/>

  <!-- Center Button Outer Ring -->
  <circle cx="256" cy="256" r="72" fill="#1e293b"/>

  <!-- Center Button White Core -->
  <circle cx="256" cy="256" r="48" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>

  <!-- Center Inner Glow Dot -->
  <circle cx="256" cy="256" r="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>

  <!-- Specular highlight overlay -->
  <circle cx="256" cy="256" r="232" fill="url(#ballShine)" pointer-events="none"/>
</svg>
